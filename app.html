function payVol(items,plan,d,budget){
  const g={};
  for(const x of items){if(x.sys||x.rem<=0.001||!x.pre||(x.date&&x.date<=d))continue;(g[x.di]=g[x.di]||[]).push(x)}
  const tot=k=>sum(g[k],x=>x.rem);
  const nx=k=>g[k].reduce((m,x)=>x.date&&x.date<m?x.date:m,'9999');
  const ids=Object.keys(g).map(Number);
  ids.sort(plan.order==='small'?(a,b)=>tot(a)-tot(b):plan.order==='soon'?(a,b)=>nx(a)<nx(b)?-1:nx(a)>nx(b)?1:0:(a,b)=>a-b);
  let paid=0;
  for(const k of ids){
    const t=tot(k),flex=g[k].every(x=>!x.date),left=budget-paid;
    if(left<=0.001)break;
    if(flex){let b=Math.min(t,left);for(const x of g[k]){const p=Math.min(x.rem,b);x.rem-=p;b-=p;paid+=p}}
    else if(t<=left+1e-9){g[k].forEach(x=>x.rem=0);paid+=t}
    else break;
  }
  return paid;
}

  const expMap={};S.exp.forEach(e=>{expMap[e.date]=(expMap[e.date]||0)+(+e.amt||0)});
  const stlMap=S.stl||{};
  const HD=(String(st.homeDays||'').match(/\d{4}-\d{2}-\d{2}/g)||[]).sort();
  const homeSet=new Set(HD);
  const homeN=homeSet.size;
  const gotMap={};S.debts.forEach(db=>{if(db.got&&db.got.date)gotMap[db.got.date]=(gotMap[db.got.date]||0)+(+db.got.amt||0)});
  const spendPlan=plan.spend==null?(+st.spend||0):plan.spend;
  const has=v=>v!==undefined&&v!==''&&v!==null;
  let cash=+st.opening||0,fund=0,bought=false,scootyDate=null,clearDate=null,firstOd=null,odDays=0,maxOd=0,raised=null,net=cash,workdays=0,tIn=0,tOut=0,tDue=0;
  let pend=0,pendG=0,negFirst=null,negMin=0,urgHave=null,urgPend=0,codOwed=0;const pays={},ded={};
  {const p0=payDate(st.start,+st.payDay),zo=+st.zOpen||0,co=+st.codOpen||0;pays[p0]=zo-co;ded[p0]=co;pend=zo-co;codOwed=co}
  const rows=[];
  for(let d=st.start;d<=st.horizon;d=addDays(d,1)){
    const log=S.log[d]||{};
    const isHome=homeSet.has(d);
    const isRest=!isHome&&plan.rest!=null&&D(d).getDay()===plan.rest;
    let tgt=d>=st.diwali?plan.post:plan.pre;
    if(plan.boost&&d<=st.diwali&&d>=addDays(st.diwali,-plan.boost.before))tgt+=plan.boost.add;
    let brk=false;
    if(plan.custom){const k=custKind(d,st);tgt=k==='full'?+st.fullAmt:k==='steady'?+st.steadyAmt:k==='after'?+st.afterAmt:0;brk=k==='brk'}
    const type=isHome?'home':(isRest||brk)?'rest':'work';
    const pz=type==='work'?tgt:0,ps=isHome?plan.sideHome:plan.side,fut=d>=today;
    const z=has(log.zepto)?+log.zepto:(d>today?pz:0);
    const sd=has(log.side)?+log.side:(fut?ps:0);
    const ex=expMap[d]||0;
    const sp=d<=today?ex:(ex>0?ex:spendPlan);
    if(type==='work'&&d>=today&&d<=st.goalDate)workdays++;
    const ln=gotMap[d]||0,pd=payDate(d,+st.payDay);
    const c=has(log.cod)?+log.cod:(d>today&&z>0?(+st.codPerDay||0):0),cs=st.codMode==='spend'?c:0,sl=st.codMode==='spend'?(+stlMap[d]||0):0;
    pays[pd]=(pays[pd]||0)+z-cs+sl;ded[pd]=(ded[pd]||0)+cs-sl;
    const got=pays[d]||0;pend+=z-cs+sl-got;codOwed+=cs-sl-(ded[d]||0);
    const rn=rentMap[d]||0;
    const up=d===st.urgDate?(+st.urgAmt||0):0;cash+=got+cs+sd-sp+ln-sl-up;net+=got+cs+sd-sp+ln-sl-up;tIn+=z+sd;tOut+=sp+up;
    if(cash<0&&fund>0){const mv=Math.min(fund,-cash);fund-=mv;cash+=mv}
    let dueP=0;
    const dl=items.filter(x=>x.date&&x.date<=d&&x.rem>0.001).sort((a,b)=>a.date<b.date?-1:1);
    for(const x of dl){
      let pay=Math.min(x.rem,Math.max(cash,0));cash-=pay;
      const more=Math.min(x.rem-pay,fund);fund-=more;pay+=more;
      x.rem-=pay;dueP+=pay;
    }
    net-=dueP;tDue+=dueP;
    const od=sum(items.filter(x=>x.date&&x.date<=d),x=>x.rem);
    if(od>0.5){odDays++;if(!firstOd)firstOd=d;if(od>maxOd)maxOd=od}
    let volP=0;
    let volTot=sum(items.filter(x=>!x.sys&&x.rem>0.001&&x.pre&&(!x.date||x.date>d)),x=>x.rem);
    if(d<=st.urgDate)volTot=0;
    const dueSoon=sum(items.filter(x=>x.date&&x.date>d&&x.date<=addDays(d,10)&&x.rem>0.001),x=>x.rem);
    const free=cash-dueSoon-(plan.buffer||0)-(d<st.urgDate?(+st.urgAmt||0):0);
    if(free>1&&d>=(st.saveFrom||'2026-11-11')){
      let sf=0,sdb=0;
      if(bought)sdb=1;
      else if(plan.strat==='scooty')sf=1;
      else if(plan.strat==='debts'){if(volTot>0.5)sdb=1;else sf=1}
      else{if(volTot>0.5){sf=.5;sdb=.5}else sf=1}
      const a=free*sf,b=free*sdb,nf=bought?0:Math.max(goal-fund,0);
      let fa=Math.min(a,nf),fb=Math.min(b,volTot),spare=(a-fa)+(b-fb);
      const r1=Math.min(spare,nf-fa);fa+=r1;spare-=r1;
      const r2=Math.min(spare,volTot-fb);fb+=r2;
      if(fa>0){fund+=fa;cash-=fa}
      if(fb>0){volP=payVol(items,plan,d,fb);cash-=volP}
    }
    let sc=false;
    if(!bought&&fund>=goal-0.001){
      fund-=goal;bought=true;scootyDate=d;sc=true;
      const emi=+st.scootyEmi||0;
      if(emi>0)for(let k=1;k<=(+st.scootyMonths||0);k++)items.push({di:-1,scooty:true,sys:true,date:addDays(d,30*k),amt:emi,rem:emi,pre:false});
    }
    const debt=sum(items.filter(x=>!x.sys),x=>x.rem);
    if(!clearDate&&debt<=0.5)clearDate=d;
    if(d===st.goalDate){raised=net;pendG=pend}
    const tt=cash+fund;if(tt<-0.5){if(!negFirst)negFirst=d;if(tt<negMin)negMin=tt}
    if(d===st.urgDate){urgHave=tt+up;urgPend=pend}
    rows.push({d,type,stl:sl,z,sd,sp,ln,got,pend,cod:c,cs,dd:ded[d]||0,codOwed,rn,pz,ps,due:dueP,vol:volP,fund,cash,debt,od,sc,clear:clearDate===d});
  }
  const h=(plan.custom?Math.max(+st.fullAmt,+st.steadyAmt,+st.afterAmt):Math.max(plan.pre+(plan.boost?plan.boost.add:0),plan.post))/rate;
  const finish=(scootyDate&&clearDate)?(scootyDate>clearDate?scootyDate:clearDate):null;
  return{negFirst,negMin,pendG,urgHave,urgPend,rows,scootyDate,clearDate,finish,firstOd,odDays,maxOd,raised:raised==null?net:raised,workdays,hMax:h,debt0,tIn,tOut,tDue,homeN};
}

function recommend(all){
  const ok=all.filter(x=>x.r.hMax<=8&&!x.p.hard);
  const pool=(ok.length?ok:all).slice();
  pool.sort((a,b)=>(a.r.odDays>0?1:0)-(b.r.odDays>0?1:0)||((a.r.finish||'9999')<(b.r.finish||'9999')?-1:(a.r.finish||'9999')>(b.r.finish||'9999')?1:0)||a.r.hMax-b.r.hMax);
  return pool[0];
}

const custKind=(d,st)=>d<=st.fullTo?'full':d<=st.breakTo?'brk':d<=st.steadyTo?'steady':'after';
function routineC(k,st){
  const rate=+st.rate||167;
  if(k==='brk')return{h:0,items:[['All day','Diwali break. Rest and family. No Zepto.']]};
  const amt=+(k==='full'?st.fullAmt:k==='steady'?st.steadyAmt:st.afterAmt)||0;
  const h=Math.max(1,Math.round(amt/rate*2)/2),z0=22-h,o=[['6:30 AM','Gym']];
  if(k!=='full')o.push(['1:00 PM','Study until '+fh(z0-0.5)]);
  o.push([fh(z0),'Zepto until 10:00 PM ('+h+' h, about '+inr(amt)+')']);
  o.push(['10:30 PM','Log your numbers, then sleep']);
  return{h,items:o};
}
function routine(plan,phase,st){
  const tgt=(phase==='post'?plan.post:plan.pre)+((phase==='pre'&&plan.boost)?plan.boost.add:0);
  const h=Math.max(1,Math.round(tgt/(+st.rate||167)*2)/2),z0=22-h,studying=phase==='post'?plan.postStudy:plan.study;
  const o=[['6:30 AM','Gym']];
  if(studying&&z0>=11)o.push(['9:00 AM','Study until '+fh(Math.min(13,z0-1.5))]);
  else if(!studying&&z0>9)o.push(['9:00 AM','Side work, errands or rest']);
  o.push([fh(z0),'Zepto until 10:00 PM ('+h+' h, about '+inr(tgt)+')']);
  o.push(['10:30 PM','Log your numbers, then sleep']);
  return{h,items:o};
}

  if(a==='setMoney'){if(v('m-cash')==='')return;S.st.start=TODAY;S.st.opening=+v('m-cash')||0;S.st.zOpen=+v('m-z')||0;S.st.codOpen=+v('m-cod')||0;commit();return}
  if(a==='codmode'){S.st.codMode=b.dataset.id;commit();return}
  if(a==='saveCod'){const o=S.log[TODAY]=S.log[TODAY]||{};if(v('c-k')!=='')o.cod=+v('c-k');commit();return}
  if(a==='settle'||a==='settleAll'){const r=cur().r,ow=Math.max(0,Math.round((r.rows.find(x=>x.d===TODAY)||r.rows[0]).codOwed)),n=a==='settleAll'?ow:Math.min(+v('c-s')||0,ow);if(n>0){S.stl[TODAY]=(S.stl[TODAY]||0)+n;commit()}return}
  if(a==='codSplit'){const lgT=S.log[TODAY]=S.log[TODAY]||{},sp=+v('c-sp')||0,bk=+v('c-bk')||0,rr=cur().r,ow=Math.max(0,Math.round((rr.rows.find(x=>x.d===TODAY)||rr.rows[0]).codOwed)),dp=Math.min(+v('c-s')||0,ow);if(sp>0){lgT.codSp=(+lgT.codSp||0)+sp;S.exp.push({id:'e'+Date.now(),date:TODAY,cat:'Other',amt:sp,note:'from COD cash'})}if(bk>0)lgT.codBank=(+lgT.codBank||0)+bk;if(dp>0)S.stl[TODAY]=(S.stl[TODAY]||0)+dp;commit();return}
  if(a==='delStl'){delete S.stl[b.dataset.id];commit();return}
  if(a==='more'){ui.days+=30;render();return}
  if(a==='saveToday'){const o=S.log[TODAY]=S.log[TODAY]||{};if(v('t-z')!=='')o.zepto=+v('t-z');if(v('t-s')!=='')o.side=+v('t-s');if(v('t-k')!=='')o.cod=+v('t-k');if(+v('t-e')>0)S.exp.push({id:'e'+Date.now(),date:TODAY,cat:v('t-c'),amt:+v('t-e'),note:''});commit();return}
  if(a==='addExp'){if(+v('ex-a')>0&&v('ex-d')){S.exp.push({id:'e'+Date.now(),date:v('ex-d'),cat:v('ex-c'),amt:+v('ex-a'),note:v('ex-n')});commit()}return}
  if(a==='delExp'){S.exp=S.exp.filter(x=>x.id!==b.dataset.id);commit();return}
  if(a==='addDebt'){if(v('nd-n')&&+v('nd-a')>0){S.debts.push({id:Date.now(),name:v('nd-n'),note:'',prepay:true,items:[{date:v('nd-d'),amt:+v('nd-a'),paid:false}]});commit()}return}
  if(a==='delDebt'){S.debts.splice(di,1);commit();return}
  if(a==='addItem'){S.debts[di].items.push({date:'',amt:0,paid:false});commit();return}
  if(a==='delItem'){S.debts[di].items.splice(ii,1);commit();return}
  if(a==='extend'){const db=S.debts[di],it=db.items[db.ext.item||0],s=db.extended?-1:1;it.date=addDays(it.date,s*db.ext.days);it.amt=Math.round(((+it.amt)+s*db.ext.fee)*100)/100;db.extended=!db.extended;commit();return}
  if(a==='reset'){if(ui.reset){S=defaults();ui.reset=false;commit()}else{ui.reset=true;render();setTimeout(()=>{ui.reset=false;if(ui.tab==='setup')render()},4000)}return}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.st!==undefined){S.st[d.st]=(t.type==='number'||t.dataset.num)?(t.value===''?0:+t.value):t.value;commit()}
  else if(d.log){const o=S.log[d.log]=S.log[d.log]||{};if(t.value==='')delete o[d.k];else o[d.k]=+t.value;commit()}
  else if(d.di!==undefined){const db=S.debts[+d.di];
    if(d.ii!==undefined){const it=db.items[+d.ii];if(d.k==='paid')it.paid=t.checked;else if(d.k==='amt')it.amt=+t.value||0;else it.date=t.value;}
    else if(d.k==='prepay')db.prepay=t.checked;
    else if(d.k==='gotDate')db.got.date=t.value;
    else if(d.k==='gotAmt')db.got.amt=+t.value||0;
    commit()}
});

</script>
<script>
/* ---------- toast, PDF report, boot (added for the Android app) ---------- */
function toast(msg,ms){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},ms||3500)}

const T=s=>String(s==null?'':s).replace(/₹/g,'Rs.').replace(/[−–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/·/g,'-').replace(/[^\x20-\x7E]/g,' ').replace(/\s+/g,' ').trim();
const rs=n=>{n=Math.round(+n||0);return (n<0?'-':'')+'Rs. '+Math.abs(n).toLocaleString('en-IN')};
const fdl=(s,o)=>T(s?fd(s,o||{day:'numeric',month:'short',year:'numeric'}):'-');

async function makePdf(days){
  const lib=window.jspdf&&window.jspdf.jsPDF;
  if(!lib){toast('PDF library did not load');return}
  try{
    days=days||30;
    const {p,r}=cur(),st=S.st,all=sims(),tr=r.rows.find(x=>x.d===TODAY)||r.rows[0];
    const doc=new lib({unit:'pt',format:'a4'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=36;
    const BR=[42,91,215],RED=[192,57,43],GRN=[22,128,60];
    doc.setFillColor(...BR);doc.rect(0,0,W,72,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(22);doc.text('Cash Plan Report',M,36);
    doc.setFont('helvetica','normal');doc.setFontSize(10);
    doc.text(T('Generated '+fd(TODAY,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'   |   Plan: '+p.name),M,56);
    doc.setTextColor(20,20,20);
    let y=92;
    const room=n=>{if(y+n>H-50){doc.addPage();y=M}};
    const head=t=>{room(60);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...BR);doc.text(T(t),M,y);doc.setTextColor(20,20,20);y+=8};
    const table=(opts)=>{doc.autoTable(Object.assign({startY:y,margin:{left:M,right:M,bottom:44},theme:'grid',styles:{fontSize:9,cellPadding:4,lineColor:[226,222,211],lineWidth:.5,textColor:[27,26,23]},headStyles:{fillColor:BR,textColor:255,fontStyle:'bold'},alternateRowStyles:{fillColor:[247,246,242]}},opts));y=doc.lastAutoTable.finalY+20};
    const dues=allDues(),owed=sum(dues,x=>x.amt)+flexTotal(),nd=dues[0];
    const uh=r.urgHave==null?0:r.urgHave,ug=(+st.urgAmt||0)-uh,gap=(+st.goal||0)-r.raised;
    const earned=sum(Object.keys(S.log).filter(d=>d<=TODAY),d=>(+S.log[d].zepto||0)+(+S.log[d].side||0));
    const spent=sum(S.exp.filter(e=>e.date<=TODAY),e=>+e.amt||0);

    head('Summary');
    table({head:[['Item','Value']],columnStyles:{0:{cellWidth:190,fontStyle:'bold'}},body:[
      ['Cash in hand after today',rs(tr.cash+tr.fund)],
      ['Zepto owes you',rs(tr.pend)+'  (pays '+fdl(payDate(TODAY,+st.payDay),{weekday:'short',day:'numeric',month:'short'})+')'],
      ['COD cash to settle',rs(tr.codOwed)],
      ['Rent to pay',rs(st.urgAmt)+' by '+fdl(st.urgDate,{day:'numeric',month:'short'})+(ug>0?'  -  you will hold '+rs(uh)+', short by '+rs(ug):'  -  covered ('+rs(uh)+')')],
      ['Scooty down payment',rs(st.goal)+' needed by '+fdl(st.goalDate,{day:'numeric',month:'short'})+'  -  raised '+rs(r.raised)+(gap>0?', short by '+rs(gap):', on track')],
      ['Scooty money ready',r.scootyDate?fdl(r.scootyDate):'Not by '+fdl(st.horizon)],
      ['All current debts cleared',r.clearDate?fdl(r.clearDate):'Not by '+fdl(st.horizon)],
      ['Total still owed',rs(owed)],
      ['Next payment',nd?rs(nd.amt)+' on '+fdl(nd.date,{weekday:'short',day:'numeric',month:'short'})+' ('+nd.name+')':'-'],
      ['Earned so far (logged)',rs(earned)],['Spent so far (logged)',rs(spent)]
    ].map(a=>a.map(T))});
    if(r.negFirst||r.odDays>0){
      room(40);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...RED);y-=8;
      if(r.negFirst){doc.text(T('Warning: cash goes below zero from '+fd(r.negFirst)+' (lowest '+rs(r.negMin)+').'),M,y);y+=14}
      if(r.odDays>0){doc.text(T('Warning: this plan misses a due payment from '+fd(r.firstOd)+' (up to '+rs(r.maxOd)+' short).'),M,y);y+=14}
      doc.setTextColor(20,20,20);y+=10;
    }

    head('Debts and payments');
    const drows=[];
    S.debts.forEach(db=>db.items.forEach((it,i)=>{const st_=it.paid?'Paid':(it.date&&it.date<TODAY?'Overdue':'Due');drows.push([i===0?db.name:'',it.date?fdl(it.date):'Flexible',rs(it.amt),st_])}));
    drows.push(['Total unpaid','',rs(owed),'']);
    table({head:[['Debt','Due','Amount','Status']],body:drows.map(a=>a.map(T)),columnStyles:{2:{halign:'right'}},
      didParseCell:d=>{if(d.section!=='body')return;const v=d.row.raw[3];if(d.column.index===3){if(v==='Paid')d.cell.styles.textColor=GRN;else if(v==='Overdue')d.cell.styles.textColor=RED}if(d.row.index===drows.length-1)d.cell.styles.fontStyle='bold'}});

    head('Day-by-day plan: next '+days+' days');
    const typ={work:'Zepto',home:'Hometown',rest:'Rest'};
    const srows=r.rows.filter(x=>x.d>=TODAY).slice(0,days).map(x=>[fdl(x.d,{weekday:'short',day:'numeric',month:'short'}),typ[x.type]+(x.sc?' + scooty':''),rs(x.z),rs(x.sd),rs(x.sp),rs(x.due+x.vol),rs(x.rn),rs(x.cash+x.fund),rs(x.debt)].map(T));
    table({head:[['Date','Day','Zepto','Extra','Spent','Debt paid','Rent','Cash + fund','Debt left']],body:srows,styles:{fontSize:7.5,cellPadding:3,lineColor:[226,222,211],lineWidth:.5,textColor:[27,26,23]},
      columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'},8:{halign:'right'}}});

    head('Expenses');
    const byCat={};S.exp.forEach(e=>{byCat[e.cat||'Other']=(byCat[e.cat||'Other']||0)+(+e.amt||0)});
    const cats=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
    if(!cats.length){doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('No expenses logged yet.',M,y+12);y+=30}
    else{
      table({head:[['Category','Total']],body:cats.map(c=>[T(c),rs(byCat[c])]).concat([['Total',rs(sum(cats,c=>byCat[c]))]]),columnStyles:{1:{halign:'right'}},tableWidth:260});
      const recent=S.exp.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,40);
      table({head:[['Date','Category','Amount','Note']],body:recent.map(e=>[fdl(e.date),T(e.cat),rs(e.amt),T(e.note)]),columnStyles:{2:{halign:'right'}}});
    }

    const ld=Object.keys(S.log).filter(d=>['zepto','side','cod'].some(k=>S.log[d][k]!=null)).sort().reverse();
    head('Earnings log');
    if(!ld.length){doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Nothing logged yet.',M,y+12);y+=30}
    else table({head:[['Date','Zepto','Extra income','COD taken']],body:ld.map(d=>[fdl(d),rs(S.log[d].zepto),rs(S.log[d].side),rs(S.log[d].cod)]).concat([['Total',rs(sum(ld,d=>+S.log[d].zepto||0)),rs(sum(ld,d=>+S.log[d].side||0)),rs(sum(ld,d=>+S.log[d].cod||0))]]),columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}}});

    head('All plans compared');
    table({head:[['Plan','Hours/day','Scooty ready','Debts cleared','Missed payment?']],
      body:all.map(x=>[(x.p.id===S.planId?'* ':'')+x.p.name,x.r.hMax.toFixed(1)+' h',x.r.scootyDate?fdl(x.r.scootyDate,{day:'numeric',month:'short',year:'2-digit'}):'Not yet',x.r.clearDate?fdl(x.r.clearDate,{day:'numeric',month:'short',year:'2-digit'}):'Not yet',x.r.odDays>0?'Yes, from '+fdl(x.r.firstOd,{day:'numeric',month:'short'}):'No'].map(T)),
      didParseCell:d=>{if(d.section==='body'&&all[d.row.index].p.id===S.planId)d.cell.styles.fontStyle='bold'}});
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(105,101,91);doc.text('* = your selected plan',M,y-8);

    const n=doc.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(105,101,91);doc.text('Cash Plan  |  '+T(fd(TODAY,{day:'numeric',month:'short',year:'numeric'})),M,H-20);doc.text('Page '+i+' of '+n,W-M,H-20,{align:'right'})}

    const fname='CashPlan_'+TODAY+'.pdf';
    if(window.DBB&&DBB.native){
      const b64=doc.output('datauristring').split(',')[1];
      const res=await DBB.savePdf(b64,fname);
      toast(res.savedTo?'Saved to '+res.savedTo:'Report ready. Choose where to save it.',5000);
    }else{doc.save(fname);toast('Report downloaded')}
  }catch(e){console.error(e);toast('Could not create PDF: '+(e&&e.message||e),6000)}
}

(async function boot(){
  let loaded=null;
  try{await DBB.init();loaded=await DBB.load()}catch(e){console.error(e);toast('Database problem: '+(e&&e.message||e),6000)}
  if(loaded&&loaded.v===1){const d=defaults();loaded.st=Object.assign(d.st,loaded.st);loaded.stl=loaded.stl||{};loaded.log=loaded.log||{};loaded.exp=loaded.exp||[];S=loaded}
  else{S=load();try{await DBB.save(S)}catch(e){console.error(e)}}
  cache=null;render();
})();

</script>
